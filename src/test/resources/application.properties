# ===================================================================
# TEST CONFIGURATION - Using H2 In-Memory Database
# ===================================================================
spring.application.name=bookinghotels-test

# ===================================================================
# DATASOURCE - H2 In-Memory (Not using Supabase for testing)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# JPA / HIBERNATE - Test Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# H2 Console (For viewing database during tests if needed)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Disable Security for testing
# ===================================================================
spring.security.enabled=false

# ===================================================================
# Mail Configuration for testing (Dummy)
# ===================================================================
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# ===================================================================
# Cloudinary (Disabled for testing)
# ===================================================================
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
