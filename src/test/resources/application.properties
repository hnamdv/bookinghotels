# ===================================================================
# TEST CONFIGURATION - Dùng H2 In-Memory Database
# ===================================================================
spring.application.name=bookinghotels-test

# ===================================================================
# DATASOURCE - H2 In-Memory (Không dùng Supabase khi test)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# JPA / HIBERNATE - Test Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# H2 Console (Xem database khi test n?u c?n)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# T?T Security khi test
# ===================================================================
spring.security.enabled=false