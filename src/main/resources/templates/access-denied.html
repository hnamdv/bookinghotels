<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không có quyền truy cập</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #1f2937;
        }
        .card {
            width: min(520px, calc(100% - 32px));
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
            padding: 34px 30px;
            text-align: center;
        }
        .icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 30px;
            background: #fff1f2;
            color: #dc2626;
            font-weight: 700;
        }
        h1 { margin: 0 0 10px; font-size: 24px; }
        p { margin: 0 0 22px; color: #6b7280; line-height: 1.5; }
        a {
            display: inline-block;
            text-decoration: none;
            background: #1f2937;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }
        .countdown { margin-top: 14px; font-size: 13px; color: #9ca3af; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">!</div>
    <h1>Bạn không có quyền vào trang này</h1>
    <p>Tài khoản hiện tại chưa được cấp quyền cho chức năng này. Hệ thống sẽ tự quay lại trang trước.</p>
    <a th:href="${backUrl}">Quay lại ngay</a>
    <div class="countdown">Tự động quay lại sau <span id="seconds">2</span> giây...</div>
</div>
<script th:inline="javascript">
    const backUrl = /*[[${backUrl}]]*/ '/admin';
    let seconds = 2;
    const secondsEl = document.getElementById('seconds');
    const timer = setInterval(() => {
        seconds -= 1;
        secondsEl.textContent = Math.max(seconds, 0);
        if (seconds <= 0) {
            clearInterval(timer);
            window.location.replace(backUrl || '/admin');
        }
    }, 1000);
</script>
</body>
</html>
