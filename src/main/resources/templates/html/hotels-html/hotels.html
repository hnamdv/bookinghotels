<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{homeadmin}">
<head>
    <title>Quản lý chi nhánh khách sạn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .page-card { background: #fff; border: 1px solid #e9e9e9; border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.03); }
        .form-control, .form-select { border-radius: 10px; }
        .brand-btn { background: #bd6c3c; color: #fff; border: 0; border-radius: 10px; padding: 10px 20px; }
        .brand-btn:hover { background: #9d5830; color: #fff; }
        .image-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .image-option { position: relative; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: #f5f5f5; }
        .image-option img { width: 100%; height: 90px; object-fit: cover; }
        .image-option input { position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; }
        .thumbs { display: flex; gap: 6px; }
        .thumbs img { width: 48px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        table td, table th { vertical-align: middle; }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="mb-4">
        <h2 class="fw-bold">Quản lý chi nhánh</h2>
        <p class="text-muted">Hệ thống chuỗi các cơ sở thuộc FeelHome.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="page-card mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0" th:text="${editBranch == null ? 'Tạo chi nhánh mới' : 'Cập nhật chi nhánh'}"></h5>
            <a class="btn btn-outline-secondary btn-sm" th:if="${editBranch != null}" th:href="@{/admin/hotels}">Hủy sửa</a>
        </div>

        <form th:action="@{/admin/hotels/save}" method="post">
            <input type="hidden" name="id" th:value="${editBranch != null ? editBranch.id : ''}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Tên chi nhánh *</label>
                    <input class="form-control" name="name" required th:value="${editBranch != null ? editBranch.name : ''}" placeholder="Ví dụ: FeelHome Vũng Tàu">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Hotline chi nhánh *</label>
                    <input class="form-control" type="tel" name="phone" required th:value="${editBranch != null ? editBranch.phone : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email chi nhánh *</label>
                    <input class="form-control" type="email" name="email" required th:value="${editBranch != null ? editBranch.email : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Địa chỉ chính xác *</label>
                    <input class="form-control" name="address" required th:value="${editBranch != null ? editBranch.address : ''}">
                </div>
                <div class="col-12">
                    <label class="form-label">Mô tả chi nhánh</label>
                    <textarea class="form-control" rows="3" name="description" th:text="${editBranch != null ? editBranch.description : ''}"></textarea>
                </div>

                <div class="col-12">
                    <div class="d-flex justify-content-between"><label class="form-label fw-semibold">Chọn ảnh từ thư viện</label><a th:href="@{/admin/media}">Tải thêm ảnh</a></div>

                    <div class="image-picker" th:if="${mediaList != null and !mediaList.isEmpty()}">
                        <label class="image-option" th:each="m:${mediaList}">
                            <img th:src="${m.fileUrl}">
                            <input type="checkbox" name="mediaIds" th:value="${m.id}" th:checked="${selectedImageUrls != null and #lists.contains(selectedImageUrls, m.fileUrl)}">
                        </label>
                    </div>
                    <p class="text-muted small" th:if="${mediaList == null or mediaList.isEmpty()}">Chưa có hình ảnh nào sẵn có trong thư viện.</p>
                </div>
            </div>

            <div class="mt-4">
                <button class="brand-btn" type="submit">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Lưu chi nhánh
                </button>
            </div>
        </form>
    </div>

    <div class="page-card">
        <div class="d-flex justify-content-between mb-3">
            <h5 class="fw-bold">Danh sách các chi nhánh</h5>
            <span class="badge bg-light text-dark border" th:text="|${#lists.size(hotels)} chi nhánh|"></span>
        </div>
        <div class="table-responsive">
            <table class="table align-middle custom-table">
                <thead>
                <tr>
                    <th>Tên chi nhánh</th>
                    <th>Liên hệ</th>
                    <th>Địa chỉ</th>
                    <th>Mô tả</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b:${hotels}">
                    <td>
                        <div class="fw-bold" th:text="${b.name}"></div>
                        <small class="text-muted">FeelHome Branch</small>
                    </td>
                    <td>
                        <div th:text="${b.phone}"></div>
                        <small class="text-muted" th:text="${b.email}"></small>
                    </td>
                    <td>
                        <div class="text-wrap" style="max-width: 250px;" th:text="${b.address}"></div>
                    </td>
                    <td>
                        <div class="text-truncate" style="max-width: 200px;" th:text="${b.description}"></div>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/hotels(editId=${b.id})}"><i class="fa-solid fa-pen"></i></a>

                        <form class="d-inline form-delete" th:action="@{/admin/hotels/{id}/delete(id=${b.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger btn-delete-trigger" type="button" th:data-name="${b.name}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.querySelectorAll('.btn-delete-trigger').forEach(button => {
            button.addEventListener('click', function () {
                const form = this.closest('.form-delete');
                const hotelName = this.getAttribute('data-name');

                Swal.fire({
                    title: 'Xác nhận xóa?',
                    text: `Bạn có chắc chắn muốn xóa chi nhánh "${hotelName}" không?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#bd6c3c', // Màu thương hiệu cam của bạn
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'Xác nhận xóa',
                    cancelButtonText: 'Hủy'
                }).then((result) => {
                    if (result.isConfirmed) {
                        form.submit(); // Chỉ gửi lệnh xóa lên Controller khi bấm xác nhận
                    }
                });
            });
        });
    </script>

</div>
</body>
</html>
