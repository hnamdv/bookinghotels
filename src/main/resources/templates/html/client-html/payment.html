<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thành toán - FeelHome Hotel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fh-dark: #1e1e24;       /* Đen bóng huyền bí */
            --fh-gold: #c5a880;       /* Vàng Gold sang trọng */
            --fh-gold-hover: #b0926a; /* Gold đậm khi hover */
            --fh-light-bg: #fdfbf7;   /* Nền kem nhạt quý phái */
            --fh-card-bg: #ffffff;
            --fh-border: #e8e4dc;     /* Đường kẻ mờ tông ấm */
            --fh-text-muted: #7e7b75;
        }

        body {
            background-color: var(--fh-light-bg);
            color: var(--fh-dark);
            font-family: 'Jost', sans-serif;
            letter-spacing: 0.02em;
        }

        .fh-title-serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .fh-mini-header {
            background-color: var(--fh-dark);
            border-bottom: 2px solid var(--fh-gold);
            padding: 15px 0;
        }
        .fh-brand-logo {
            color: #fff;
            text-decoration: none;
            font-size: 1.6rem;
            text-transform: uppercase;
        }
        .fh-brand-logo span {
            color: var(--fh-gold);
        }

        .payment-card {
            background: var(--fh-card-bg);
            border: 1px solid var(--fh-border);
            border-radius: 0px;
            padding: 35px;
        }

        .card-title-line {
            font-size: 1.6rem;
            color: var(--fh-dark);
            border-bottom: 1px solid var(--fh-border);
            padding-bottom: 15px;
            margin-bottom: 30px;
            position: relative;
        }

        .card-title-line::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 60px;
            height: 2px;
            background-color: var(--fh-gold);
        }

        .form-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--fh-dark);
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1px solid var(--fh-border);
            border-radius: 0px;
            padding: 12px 18px;
            background-color: #faf9f6;
            color: var(--fh-dark);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--fh-gold);
            background-color: #fff;
            box-shadow: none;
        }

        .invoice-sidebar {
            background: var(--fh-card-bg);
            border: 1px solid var(--fh-dark);
            border-radius: 0px;
            padding: 35px 30px;
            position: sticky;
            top: 40px;
        }

        .info-group-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--fh-border);
        }

        .total-box {
            background: #f9f6f0;
            border-top: 1px solid var(--fh-border);
            border-bottom: 1px solid var(--fh-border);
            padding: 20px 15px;
            margin: 25px 0;
            text-align: center;
        }

        .btn-fh-primary {
            background: var(--fh-dark);
            color: #fff;
            border: 1px solid var(--fh-dark);
            padding: 15px 25px;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.1em;
            font-size: 0.9rem;
            border-radius: 0px;
            transition: all 0.4s ease;
            width: 100%;
        }

        .btn-fh-primary:hover {
            background: var(--fh-gold);
            border-color: var(--fh-gold);
            color: #fff;
        }

        .text-fh-gold {
            color: var(--fh-gold) !important;
        }

        /* Khung dịch vụ cao cấp */
        .service-item-box {
            border: 1px solid var(--fh-border);
            background-color: #ffffff;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .service-item-box:hover {
            border-color: var(--fh-gold);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(197, 168, 128, 0.15);
        }
        .service-img-wrapper {
            width: 100%;
            height: 140px;
            overflow: hidden;
            background-color: #f0ede6;
        }
        .service-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .service-item-box:hover .service-img-wrapper img {
            transform: scale(1.08);
        }
        .service-content {
            padding: 15px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="fh-mini-header mb-5 shadow-sm">
    <div class="container text-center text-md-start">
        <a href="/" class="fh-brand-logo fh-title-serif">FEEL<span>HOME</span></a>
    </div>
</div>

<div class="container pb-5">
    <form th:action="@{/booking/confirm-payment}" method="post">
        <input type="hidden" name="roomId" th:value="${booking.roomId}">
        <input type="hidden" id="selectedServicesJson" name="selectedServicesJson" value="[]">

        <div class="row g-5">
            <div class="col-lg-8">
                <div class="payment-card shadow-sm mb-4">
                    <h2 class="card-title-line fh-title-serif">Thông tin đặt phòng</h2>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-calendar2-check me-2 text-fh-gold"></i>Ngày đặt phòng (Check-in)</label>
                            <input type="date" id="checkinDate" name="checkinDate" class="form-control" th:value="${booking.checkinDate}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-calendar2-x me-2 text-fh-gold"></i>Ngày trả phòng (Check-out)</label>
                            <input type="date" id="checkoutDate" name="checkoutDate" class="form-control" th:value="${booking.checkoutDate}" required>
                        </div>

                        <div class="col-md-12 my-2">
                            <hr style="border-color: var(--fh-border)">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Họ và tên khách hàng</label>
                            <input type="text" name="customerName" class="form-control" required placeholder="Nhập đầy đủ họ và tên">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại</label>
                            <input type="tel" name="customerPhone" class="form-control" required placeholder="Ví dụ: 0901234567">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Địa chỉ Email</label>
                            <input type="email" name="customerEmail" class="form-control" required placeholder="Ví dụ: hoten@gmail.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số lượng người lớn</label>
                            <input type="number" name="adultCount" class="form-control" value="1" min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số lượng trẻ em</label>
                            <input type="number" name="childCount" class="form-control" value="0" min="0">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Phương thức thanh toán quý khách chọn</label>
                            <select name="paymentMethod" class="form-select">
                                <option value="CHUYỂN KHOẢN">Chuyển khoản trực tuyến qua mã QR nhanh</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="payment-card shadow-sm">
                    <h2 class="card-title-line fh-title-serif">Dịch vụ & Tiện ích đi kèm</h2>
                    <div class="row g-4">
                        <div class="col-md-4 col-sm-6" th:each="food : ${foodMenu}">
                            <div class="service-item-box">
                                <div class="service-img-wrapper">
                                    <img th:src="${food.name == 'CƠM' || food.name == 'Cơm'} ? 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&auto=format&fit=crop&q=80' :
                                               (${food.name == 'GYM' || food.name == 'Gym'} ? 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=400&auto=format&fit=crop&q=80' :
                                               (${food.name == 'ĂN SÁNG TẠI GIƯỜNG' || food.name == 'Ăn sáng tại giường'} ? 'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400&auto=format&fit=crop&q=80' :
                                               'https://images.unsplash.com/photo-1608885898957-a599fb18de37?w=400&auto=format&fit=crop&q=80'))"
                                         alt="Service Image">
                                </div>

                                <div class="service-content">
                                    <div>
                                        <strong class="d-block text-dark small text-uppercase mb-1" th:text="${food.getName()}">Tên dịch vụ</strong>
                                        <span class="text-fh-gold fw-semibold d-block mb-3 small"
                                              th:text="${#numbers.formatDecimal(food.getPrice(), 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                                    </div>

                                    <div class="d-flex align-items-center justify-content-center gap-2 mt-auto">
                                        <button type="button" class="btn btn-sm btn-outline-dark rounded-0 px-2 btn-qty-minus"
                                                th:data-id="${food.id}" th:data-price="${food.getPrice()}">-</button>
                                        <span class="fw-bold px-2" style="min-width: 20px;" th:id="'qty-' + ${food.id}">0</span>
                                        <button type="button" class="btn btn-sm btn-outline-dark rounded-0 px-2 btn-qty-plus"
                                                th:data-id="${food.id}" th:data-price="${food.getPrice()}">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="invoice-sidebar shadow-sm">
                    <h3 class="fh-title-serif card-title-line">Chi tiết hóa đơn</h3>

                    <div class="mb-4">
                        <label class="text-uppercase small fw-bold text-muted d-block mb-1" style="letter-spacing: 0.05em">Hạng phòng đã chọn</label>
                        <strong class="fh-title-serif fs-4 text-dark d-block" th:text="${booking.roomName}">Tên loại phòng</strong>
                    </div>

                    <div class="info-group-line">
                        <span class="small text-secondary">Thời gian lưu trú:</span>
                        <span class="small text-dark fw-medium text-end">
                            <span id="lblCheckin" th:text="${booking.checkinDate}"></span> <br>
                            đến <span id="lblCheckout" th:text="${booking.checkoutDate}"></span>
                        </span>
                    </div>

                    <div class="info-group-line">
                        <span class="small text-secondary">Tổng số đêm:</span>
                        <span class="text-dark fw-bold"><span id="lblDays" th:text="${booking.days}">1</span> đêm</span>
                    </div>

                    <div class="info-group-line">
                        <span class="small text-secondary">Giá mỗi đêm (Đã ưu đãi):</span>
                        <span class="text-dark fw-medium" id="roomPriceVal" th:data-price="${booking.roomPrice}"
                              th:text="${#numbers.formatDecimal(booking.roomPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                    </div>

                    <div class="info-group-line">
                        <span class="small text-secondary">Chi phí dịch vụ thêm:</span>
                        <span class="text-dark fw-medium" id="serviceTotalVal">0 VND</span>
                    </div>

                    <div class="total-box">
                        <label class="text-uppercase small fw-bold d-block mb-2 text-secondary" style="letter-spacing: 0.08em">Tổng cộng chi phí</label>
                        <strong class="fs-3 text-fh-gold fh-title-serif" id="totalAmountVal"
                                th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></strong>
                    </div>

                    <button type="submit" class="btn btn-fh-primary py-3">Xác nhận đặt phòng</button>

                    <div class="text-center mt-3">
                        <small class="text-muted" style="font-size: 0.8rem;"><i class="bi bi-shield-check me-1"></i> Bảo mật thông tin khách hàng tuyệt đối.</small>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    const txtCheckin = document.getElementById('checkinDate');
    const txtCheckout = document.getElementById('checkoutDate');
    const lblCheckin = document.getElementById('lblCheckin');
    const lblCheckout = document.getElementById('lblCheckout');
    const lblDays = document.getElementById('lblDays');
    const roomPriceVal = document.getElementById('roomPriceVal');
    const totalAmountVal = document.getElementById('totalAmountVal');
    const serviceTotalVal = document.getElementById('serviceTotalVal');

    const roomPrice = parseFloat(roomPriceVal.getAttribute('data-price'));
    let cartServices = {};

    function recalculateInvoice() {
        const date1 = new Date(txtCheckin.value);
        const date2 = new Date(txtCheckout.value);

        let days = 1;
        if (!isNaN(date1) && !isNaN(date2)) {
            lblCheckin.innerText = txtCheckin.value;
            lblCheckout.innerText = txtCheckout.value;

            const timeDiff = date2.getTime() - date1.getTime();
            days = Math.ceil(timeDiff / (1000 * 3600 * 24));
            if (days <= 0) days = 1;
            lblDays.innerText = days;
        }

        let serviceTotal = 0;
        let serviceList = [];
        for (let key in cartServices) {
            serviceTotal += cartServices[key].quantity * cartServices[key].price;
            serviceList.push({ fwbId: cartServices[key].fwbId, quantity: cartServices[key].quantity });
        }

        serviceTotalVal.innerText = serviceTotal.toLocaleString('en-US') + ' VND';
        document.getElementById('selectedServicesJson').value = JSON.stringify(serviceList);

        const totalFinal = (roomPrice * days) + serviceTotal;
        totalAmountVal.innerText = totalFinal.toLocaleString('en-US') + ' VND';
    }

    document.querySelectorAll('.btn-qty-plus').forEach(button => {
        button.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            const price = parseFloat(this.getAttribute('data-price'));
            if (!cartServices[id]) {
                cartServices[id] = { fwbId: parseInt(id), quantity: 0, price: price };
            }
            cartServices[id].quantity += 1;
            document.getElementById('qty-' + id).innerText = cartServices[id].quantity;
            recalculateInvoice();
        });
    });

    document.querySelectorAll('.btn-qty-minus').forEach(button => {
        button.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            if (cartServices[id] && cartServices[id].quantity > 0) {
                cartServices[id].quantity -= 1;
                document.getElementById('qty-' + id).innerText = cartServices[id].quantity;
                if (cartServices[id].quantity === 0) {
                    delete cartServices[id];
                }
                recalculateInvoice();
            }
        });
    });

    txtCheckin.addEventListener('change', recalculateInvoice);
    txtCheckout.addEventListener('change', recalculateInvoice);
</script>

</body>
</html>
