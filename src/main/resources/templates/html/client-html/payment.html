<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fh-dark: #111111;
            --fh-gold: #c5a880;
            --fh-light-bg: #fafafa;
            --fh-border: #eaeaea;
        }

        body {
            background-color: var(--fh-light-bg);
            color: #333;
            font-family: 'Jost', sans-serif;
        }

        .fh-title-serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
        }

        .payment-card {
            background: #fff;
            border: 1px solid var(--fh-border);
            border-radius: 4px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card-title-line {
            font-size: 1.25rem;
            border-bottom: 1px solid var(--fh-border);
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .form-control {
            border: 1px solid #d1d1d1;
            border-radius: 2px;
            padding: 10px 15px;
        }

        .form-control:focus {
            border-color: var(--fh-gold);
            box-shadow: none;
        }

        .invoice-sidebar {
            background: #fff;
            border: 1px solid var(--fh-dark);
            border-radius: 4px;
            padding: 25px;
            position: sticky;
            top: 30px;
        }

        .total-box {
            background: #f8f6f2;
            border-left: 3px solid var(--fh-gold);
            padding: 15px;
            margin: 20px 0;
        }

        .btn-fh-primary {
            background: var(--fh-dark);
            color: #fff;
            border: 1px solid var(--fh-dark);
            padding: 12px 25px;
            text-transform: uppercase;
            width: 100%;
        }

        .btn-fh-primary:hover {
            background: var(--fh-gold);
            border-color: var(--fh-gold);
            color: var(--fh-dark);
        }
    </style>
</head>
<body>

<div class="container py-5">

    <form th:action="@{/booking/confirm-payment}" method="post">

        <!-- Hidden -->
        <input type="hidden" name="roomId" th:value="${booking.roomId}">

        <div class="row g-4">

            <!-- LEFT -->
            <div class="col-lg-8">

                <!-- CUSTOMER INFO -->
                <div class="payment-card shadow-sm">
                    <h2 class="card-title-line fh-title-serif">
                        <i class="bi bi-person-check me-2"></i>
                        Thông tin khách lưu trú
                    </h2>

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label>Họ và tên</label>
                            <input type="text"
                                   name="customerName"
                                   required
                                   class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label>Số điện thoại</label>
                            <input type="tel"
                                   name="customerPhone"
                                   required
                                   class="form-control">
                        </div>

                        <div class="col-12">
                            <label>Email</label>
                            <input type="email"
                                   name="customerEmail"
                                   required
                                   class="form-control">
                        </div>

                        <!-- CHECKIN -->
                        <div class="col-md-6">
                            <label>Ngày nhận phòng</label>
                            <input type="date"
                                   id="checkinDate"
                                   name="checkinDate"
                                   th:value="${booking.checkinDate}"
                                   class="form-control"
                                   onchange="calculateTotal()">
                        </div>

                        <!-- CHECKOUT -->
                        <div class="col-md-6">
                            <label>Ngày trả phòng</label>
                            <input type="date"
                                   id="checkoutDate"
                                   name="checkoutDate"
                                   th:value="${booking.checkoutDate}"
                                   class="form-control"
                                   onchange="calculateTotal()">
                        </div>

                        <!-- GUEST -->
                        <div class="col-md-6">
                            <label>Người lớn</label>
                            <input type="number"
                                   name="adultCount"
                                   value="2"
                                   min="1"
                                   class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label>Trẻ em</label>
                            <input type="number"
                                   name="childCount"
                                   value="0"
                                   min="0"
                                   class="form-control">
                        </div>

                    </div>
                </div>

                <!-- PAYMENT -->
                <div class="payment-card shadow-sm">
                    <h2 class="card-title-line fh-title-serif">
                        <i class="bi bi-wallet2 me-2"></i>
                        Phương thức thanh toán
                    </h2>

                    <div class="mb-3">
                        <input type="radio"
                               name="paymentMethod"
                               value="VIETQR"
                               checked
                               class="form-check-input me-2">
                        <label>Chuyển khoản ngân hàng (VietQR)</label>
                    </div>

                    <div class="alert alert-warning">
                        Sau khi nhấn xác nhận, hệ thống sẽ tạo booking và chuyển sang trang QR.
                    </div>
                </div>

            </div>

            <!-- RIGHT -->
            <div class="col-lg-4">

                <div class="invoice-sidebar shadow-sm">

                    <h2 class="card-title-line fh-title-serif">
                        <i class="bi bi-receipt me-2"></i>
                        Chi tiết hóa đơn
                    </h2>

                    <div class="mb-3">
                        <span class="text-muted">Loại phòng:</span>
                        <div class="fw-bold" th:text="${booking.roomName}"></div>
                    </div>

                    <div class="mb-3">
                        <span class="text-muted">Ngày nhận:</span>
                        <div id="showCheckin" th:text="${booking.checkinDate}"></div>
                    </div>

                    <div class="mb-3">
                        <span class="text-muted">Ngày trả:</span>
                        <div id="showCheckout" th:text="${booking.checkoutDate}"></div>
                    </div>

                    <div class="mb-3">
                        <span class="text-muted">Số đêm:</span>
                        <div id="totalDays" th:text="${booking.days} + ' đêm'"></div>
                    </div>

                    <div class="total-box d-flex justify-content-between">
                        <span>Tổng thanh toán:</span>
                        <span id="totalAmount"
                              class="fw-bold"
                              th:text="${#numbers.formatDecimal(booking.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'">
                        </span>
                    </div>

                    <button type="submit" class="btn btn-fh-primary">
                        XÁC NHẬN ĐẶT PHÒNG
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                </div>

            </div>

        </div>

    </form>

</div>

<script>
    function calculateTotal() {
        const checkin = document.getElementById("checkinDate").value;
        const checkout = document.getElementById("checkoutDate").value;

        const roomPrice = [[${booking.roomPrice}]];

        if (checkin && checkout) {
            const start = new Date(checkin);
            const end = new Date(checkout);

            let diff = Math.ceil((end - start) / (1000 * 60 * 60 * 24));

            if (diff <= 0) diff = 1;

            const total = roomPrice * diff;

            document.getElementById("showCheckin").innerText = checkin;
            document.getElementById("showCheckout").innerText = checkout;
            document.getElementById("totalDays").innerText = diff + " đêm";
            document.getElementById("totalAmount").innerText =
                total.toLocaleString('vi-VN') + " ₫";
        }
    }
</script>

</body>
</html>
