<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán - FeelHome Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 p-10">
<div class="max-w-2xl mx-auto bg-white p-10 rounded-3xl shadow-lg">
    <h1 class="text-3xl font-serif mb-6">Thông tin thanh toán</h1>
    <div class="border-t border-b py-6 mb-6">
        <p class="text-stone-600">Khách hàng: <span th:text="${booking.name}" class="font-bold"></span></p>
        <p class="text-stone-600">Số điện thoại: <span th:text="${booking.phone}"></span></p>
        <p class="text-stone-600">Ngày đặt: <span th:text="${booking.checkinDate} + ' đến ' + ${booking.checkoutDate}"></span></p>
    </div>

    <div class="mb-8">
        <h3 class="font-bold text-lg mb-2">Phương thức thanh toán</h3>
        <div class="space-y-3">
            <label class="flex items-center p-4 border rounded-xl cursor-pointer hover:bg-stone-50">
                <input type="radio" name="pay" checked class="mr-3"> Chuyển khoản ngân hàng
            </label>
            <label class="flex items-center p-4 border rounded-xl cursor-pointer hover:bg-stone-50">
                <input type="radio" name="pay" class="mr-3"> Ví điện tử (Momo/VNPay)
            </label>
        </div>
    </div>

    <form th:action="@{/booking/confirm-payment}" method="post">
        <input type="hidden" name="bookingId" th:value="${booking.id}">
        <button type="submit" class="w-full bg-[#d4af37] text-white py-4 rounded-xl font-bold hover:bg-[#b8962d]">XÁC NHẬN THANH TOÁN</button>
    </form>
</div>
</body>
</html>
