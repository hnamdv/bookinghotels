<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yêu thích | FeelHome</title><link rel="stylesheet" href="/css/style.css?v=mvc-perf-final"><style>.wrap{max-width:1320px;margin:auto;padding:120px 24px}.note{background:#fff7e8;border:1px solid #e7c892;border-radius:18px;padding:20px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #eee}.card img{width:100%;height:220px;object-fit:cover}.card div{padding:18px}.card h3{font-family:var(--font-serif);font-size:28px}</style></head><body><header class="fh-header"><div class="fh-header__inner"><a href="/home" class="fh-logo"><span class="fh-logo__icon">◈</span><span class="fh-logo__text">FEELHOME</span></a><nav class="fh-nav"><a href="/home" class="fh-nav__link">Trang Chủ</a><a href="/favorites" class="fh-nav__link active">Yêu Thích</a></nav></div></header><main class="wrap"><div class="section-heading"><p>Danh sách đã lưu</p><h2>Phòng yêu thích</h2></div><div class="note">Trang này đã chuyển sang Controller + Thymeleaf. Project chưa có bảng Favorite riêng nên đang hiển thị danh sách phòng gợi ý. Muốn lưu yêu thích theo tài khoản cần thêm entity Favorite hoặc dùng bảng tương đương nếu có.</div><div class="grid"><article class="card" th:each="room:${rooms}"><img th:src="${room.image}" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80'"><div><h3 th:text="${room.name}"></h3><p th:text="${room.hotelName}"></p><a class="fh-btn-primary" th:href="${room.detailUrl}">Xem phòng</a></div></article></div></main></body></html>
