<!-- Script bổ trợ đồng bộ tham số đặt phòng tránh lỗi lệch roomId/roomTypeId -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const observer = new MutationObserver(function (mutations, obs) {
            const bookingButtons = document.querySelectorAll('a[href*="/booking"], button.btn-book, .book-btn, a[href*="payment"]');
            bookingButtons.forEach(btn => {
                if (!btn.dataset.fixed) {
                    btn.dataset.fixed = "true";
                    btn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const urlParams = new URLSearchParams(window.location.search);
                        const roomTypeId = urlParams.get('id') || urlParams.get('roomTypeId');
                        const checkin = urlParams.get('checkin') || new Date().toISOString().split('T')[0];
                        let checkout = urlParams.get('checkout');
                        
                        if (!checkout) {
                            let d = new Date();
                            d.setDate(d.getDate() + 1);
                            checkout = d.toISOString().split('T')[0];
                        }

                        if (roomTypeId) {
                            // Chuyển hướng chuẩn sang trang check phòng với đầy đủ thông tin loại phòng và ngày tháng
                            window.location.href = `/booking/check?roomTypeId=${roomTypeId}&checkin=${checkin}&checkout=${checkout}`;
                        } else {
                            window.location.href = btn.href || `/booking/check?checkin=${checkin}&checkout=${checkout}`;
                        }
                    });
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });
    });
</script>
</body>
