<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${room.nameType} + ' | FeelHome'">Chi tiết phòng</title><link rel="stylesheet" href="/css/style.css?v=mvc-detail-final"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>.branch-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(210,173,91,.65);background:#fff}.detail-wrap{max-width:1320px;margin:auto;padding:115px 24px 70px}.breadcrumbs{color:#777;margin-bottom:24px}.detail-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:42px}.main-photo{height:560px;background:#eee;border-radius:28px;overflow:hidden;position:relative}.main-photo img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:10px;margin-top:12px}.thumbs button{border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:#fff}.thumbs img{width:92px;height:72px;object-fit:cover}.thumbs button.active{border-color:var(--gold)}.info h1{font-family:var(--font-serif);font-size:52px}.kicker{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px}.price del{color:#999;margin-right:10px}.price strong{font-size:34px;color:#bd6c3c}.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.chips span{border:1px solid #e1d6c8;border-radius:999px;padding:9px 14px;background:#fffaf3}.promo-box{border:1px solid #e2bd62;background:#fff3d2;border-radius:18px;padding:18px;margin:18px 0}.hotel-box{background:#f7f3ec;border-radius:18px;padding:20px;margin-top:24px}.cta{display:flex;gap:12px;margin-top:22px}.availability{font-weight:800;color:#0c985c}@media(max-width:900px){.detail-grid{grid-template-columns:1fr}.main-photo{height:360px}.info h1{font-size:38px}}.promo-leaf{position:absolute;right:20px;top:0;background:linear-gradient(180deg,#12a76b,#057044);color:white;padding:18px 14px 24px;font-weight:900;border-radius:0 0 8px 8px;box-shadow:0 15px 30px rgba(5,112,68,.3)}.promo-leaf:after{content:"";position:absolute;left:0;right:0;bottom:-14px;border-left:28px solid transparent;border-right:28px solid transparent;border-top:14px solid #057044}.promo-count{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#0d2b1e;color:#fff;border-radius:999px;padding:9px 13px;font-weight:800;font-size:13px}.promo-count i{color:#f7c760}.price-save{display:inline-flex;gap:8px;align-items:center;background:#e9fff3;color:#047044;border-radius:999px;padding:7px 11px;margin-left:8px;font-weight:800;font-size:13px}</style></head>
<body><header class="fh-header"><div class="fh-header__inner"><a href="/home" class="fh-logo"><img th:if="${siteLogo != null and !siteLogo.isBlank()}" class="branch-logo" th:src="${siteLogo}" alt="Logo"><span th:if="${siteLogo == null or siteLogo.isBlank()}" class="branch-logo" style="display:inline-flex;align-items:center;justify-content:center;color:#bd6c3c;font-weight:900">FH</span><span class="fh-logo__text" th:text="${siteName}">FEELHOME HOTEL</span></a><nav class="fh-nav" id="fh-nav"><a href="/home" class="fh-nav__link">Trang Chủ</a><a href="/home#rooms-section" class="fh-nav__link">Phòng Nghỉ</a><a href="/offers" class="fh-nav__link">Ưu Đãi</a><a href="/favorites" class="fh-nav__link">Yêu Thích</a></nav><button class="fh-hamburger" id="fh-hamburger"><span></span><span></span><span></span></button></div></header>
<main class="detail-wrap"><div class="breadcrumbs"><a href="/home">Trang chủ</a> › <span th:text="${room.nameType}"></span></div><section class="detail-grid"><div><div class="main-photo"><img id="mainImage" th:src="${mainImage}" th:alt="${room.nameType}" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80'"><span class="promo-leaf" th:if="${hasPromotion}" th:text="|-${discountPercent}%|"></span></div><div class="thumbs"><button type="button" th:each="img,st:${images}" th:classappend="${st.index==0?'active':''}" onclick="document.getElementById('mainImage').src=this.querySelector('img').src;document.querySelectorAll('.thumbs button').forEach(b=>b.classList.remove('active'));this.classList.add('active')"><img th:src="${img}" th:alt="|Ảnh phòng ${st.index+1}|"></button></div></div><div class="info"><p class="kicker" th:text="${hotel != null ? hotel.name : 'FeelHome Hotel'}"></p><h1 th:text="${room.nameType}"></h1><div class="price"><del th:if="${hasPromotion}" th:text="${#numbers.formatDecimal(originalPrice,0,'COMMA',0,'POINT')} + ' đ/đêm'"></del><strong th:text="${#numbers.formatDecimal(discountedPrice,0,'COMMA',0,'POINT')} + ' đ/đêm'"></strong><span class="price-save" th:if="${hasPromotion}" th:text="|Tiết kiệm ${discountPercent}%|"></span></div><p class="availability" th:if="${availableRooms != null}" th:text="|Còn ${availableRooms}/${totalRooms} phòng trong thời gian đã chọn|"></p><div class="chips"><span th:if="${room.capacity != null}"><i class="bi bi-people"></i> <b th:text="${room.capacity}"></b> khách</span><span th:if="${room.bed != null and !#strings.isEmpty(room.bed)}" th:text="${room.bed}"></span><span th:if="${room.area != null}" th:text="|${room.area} m²|"></span><span th:each="chip:${bedOptionChips}" th:text="${chip}"></span></div><div class="promo-box" th:if="${hasPromotion}"><b th:text="${promotion.promotionName}">Ưu đãi</b><p th:text="|Giảm ${discountPercent}% từ ${#numbers.formatDecimal(originalPrice,0,'COMMA',0,'POINT')} đ còn ${#numbers.formatDecimal(discountedPrice,0,'COMMA',0,'POINT')} đ/đêm|"></p><div class="promo-count js-promo-countdown" th:if="${promotionEndAt != null}" th:data-promo-end="${promotionEndAt}"><i class="bi bi-clock-history"></i><span>Đang tính thời gian còn lại...</span></div></div><p th:text="${room.description}"></p><form method="get" th:action="@{'/roomdetail/' + ${room.id}}" style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><input type="date" name="checkin" th:value="${checkin}"><input type="date" name="checkout" th:value="${checkout}"><button class="fh-btn-outline" type="submit">Kiểm tra ngày</button></form><div class="cta"><a class="fh-btn-primary" th:href="${bookingUrl}">Đặt ngay</a><a class="fh-btn-outline" href="/home#rooms-section">Xem loại khác</a></div><div class="hotel-box" th:if="${hotel != null}"><h3>Thông tin khách sạn</h3><b th:text="${hotel.name}"></b><p th:text="${hotel.address}"></p><p th:text="${hotel.phone}"></p></div></div></section></main><script>document.getElementById('fh-hamburger')?.addEventListener('click',()=>document.getElementById('fh-nav')?.classList.toggle('open'));</script><script>(function(){function pad(v){return String(v).padStart(2,'0')}function tick(){document.querySelectorAll('.js-promo-countdown').forEach(el=>{const end=new Date(el.dataset.promoEnd);const span=el.querySelector('span')||el;if(isNaN(end))return;const diff=end-Date.now();if(diff<=0){span.textContent='Ưu đãi vừa hết hạn';return;}const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);span.textContent='Còn '+(d?d+' ngày ':'')+pad(h)+':'+pad(m)+':'+pad(s);});}tick();setInterval(tick,1000);})();</script></body></html>
