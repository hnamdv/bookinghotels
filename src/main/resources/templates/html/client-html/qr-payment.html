<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán QR - FeelHome Hotel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fh-dark: #1e1e24;
            --fh-gold: #c5a880;
            --fh-light-bg: #fdfbf7;
            --fh-card-bg: #ffffff;
            --fh-border: #e8e4dc;
        }

        body {
            background-color: var(--fh-light-bg);
            color: var(--fh-dark);
            font-family: 'Jost', sans-serif;
            letter-spacing: 0.02em;
        }

        .fh-title-serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .fh-mini-header {
            background-color: var(--fh-dark);
            border-bottom: 2px solid var(--fh-gold);
            padding: 15px 0;
        }

        .fh-brand-logo {
            color: #fff;
            text-decoration: none;
            font-size: 1.6rem;
            text-transform: uppercase;
        }

        .fh-brand-logo span {
            color: var(--fh-gold);
        }

        .qr-card {
            background: var(--fh-card-bg);
            border: 1px solid var(--fh-border);
            border-radius: 0px;
            padding: 40px;
            max-width: 520px;
            margin: 0 auto;
            contain: content;
        }

        .qr-image-wrapper {
            background: #fff;
            padding: 15px;
            display: inline-block;
            border: 1px solid var(--fh-border);
            margin: 20px 0;
            min-width: 260px;
            min-height: 260px;
        }

        .transfer-detail-box {
            background-color: #f9f6f0;
            border-left: 3px solid var(--fh-gold);
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        .pulse-status {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--fh-gold);
            border-radius: 50%;
            animation: pulse-animation 1.5s infinite ease-in-out;
            will-change: transform, opacity;
        }

        @keyframes pulse-animation {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .btn-fh-cancel {
            background: transparent;
            color: #888;
            border: 1px solid var(--fh-border);
            padding: 12px 20px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            border-radius: 0px;
            transition: background-color 0.2s, color 0.2s;
            width: 100%;
        }

        .btn-fh-cancel:hover {
            background: #fff5f5;
            color: #dc3545;
            border-color: #f5c2c2;
        }

        .text-fh-gold {
            color: var(--fh-gold) !important;
        }
    </style>
</head>
<body>

<div class="fh-mini-header mb-5 shadow-sm">
    <div class="container text-center">
        <a href="/" class="fh-brand-logo fh-title-serif">FEEL<span>HOME</span></a>
    </div>
</div>

<div class="container pb-5">
    <div class="text-center mb-4">
        <h2 class="fh-title-serif fs-1">Thanh Toán Trực Tuyến</h2>
        <p class="text-muted small text-uppercase" style="letter-spacing: 0.1em">Vui lòng quét mã QR dưới đây để hoàn tất giữ phòng</p>
    </div>

    <div class="qr-card shadow-sm text-center">
        <div class="d-flex justify-content-between border-bottom pb-3 mb-3 text-start">
            <div>
                <span class="text-muted small d-block">MÃ ĐẶT PHÒNG</span>
                <strong class="fs-5" th:text="'#' + ${booking.id}">#75</strong>
            </div>
            <div class="text-end">
                <span class="text-muted small d-block">SỐ TIỀN CẦN QUÉT</span>
                <strong class="fs-5 text-fh-gold" th:text="${#numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">4,500 VND</strong>
            </div>
        </div>

        <div class="qr-image-wrapper shadow-sm">
            <img th:src="'https://qr.sepay.vn/img?bank=MBBank&acc=0855587468&template=compact&showinfo=true&holder=NGUYEN%20DUC%20PHAT&amount='
                    + ${#numbers.formatDecimal(invoice.totalAmount, 1, 'NONE', 0, 'POINT')}
                    + '&des=FEELHOMEBK' + ${booking.id}"
                 class="img-fluid"
                 width="260"
                 height="260"
                 loading="eager"
                 alt="Mã QR Chuyển Khoản FeelHome">
        </div>

        <div class="transfer-detail-box">
            <div class="mb-1 small text-secondary">NỘI DUNG CHUYỂN KHOẢN CHUẨN XÁC:</div>
            <div class="d-flex align-items-center justify-content-between">
                <span class="fs-4 fw-bold text-danger tracking-wider" th:text="'FEELHOMEBK' + ${booking.id}">FEELHOMEBK75</span>
                <span class="badge bg-dark small fw-normal py-1 px-2" style="border-radius: 0;"><i class="bi bi-upc-scan me-1"></i> Hệ thống tự quét</span>
            </div>
        </div>

        <div class="pulse-status my-4">
            <div class="pulse-dot"></div>
            <span>Hệ thống đang chờ đợi giao dịch thực tế...</span>
        </div>

        <div class="pt-3 border-top">
            <button type="button" id="btnCancelPayment" class="btn btn-fh-cancel">
                <i class="bi bi-x-circle me-2"></i> Hủy giao dịch & giải phòng phòng
            </button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const bookingId = /*[[${booking.id}]]*/ null;
    let checkPaymentInterval = null;
    let isProcessing = false; // Cờ chống spam request đè nhau khi bất đồng bộ chưa xử lý xong

    if (bookingId) {
        checkPaymentInterval = setInterval(function() {
            if (isProcessing) return; // Nếu request trước chưa trả về kết quả, bỏ qua lượt này

            isProcessing = true;
            fetch('/booking/api/invoice-status/' + bookingId)
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.json();
                })
                .then(data => {
                    isProcessing = false;
                    // Chấp nhận kiểm tra linh hoạt cả thuộc tính 'status' hoặc 'paymentStatus' từ API của bạn
                    let currentStatus = data.status || data.paymentStatus;

                    if (currentStatus === 'PAID') {
                        clearInterval(checkPaymentInterval);
                        alert("🎉 Hệ thống FeelHome đã nhận được tiền! Cảm ơn quý khách.");
                        window.location.href = '/';
                    }
                })
                .catch(error => {
                    isProcessing = false;
                    console.warn('Hệ thống đang giữ kết nối an toàn...');
                });
        }, 3000); // Polling kiểm tra trạng thái mỗi 3 giây
    }

    document.getElementById('btnCancelPayment').addEventListener('click', function() {
        if (confirm("Hành động này sẽ giải phóng trạng thái phòng trống hiện tại về hệ thống. Bạn có chắc chắn muốn hủy đặt phòng không?")) {
            if (checkPaymentInterval) clearInterval(checkPaymentInterval);

            if (bookingId) {
                fetch('/booking/api/cancel-booking/' + bookingId, { method: 'POST' })
                .then(() => { window.location.href = '/'; })
                .catch(() => { window.location.href = '/'; });
            } else {
                window.location.href = '/';
            }
        }
    });
    /*]]>*/
</script>

</body>
</html>
