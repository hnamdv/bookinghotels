<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ưu đãi | FeelHome</title><link rel="stylesheet" href="/css/style.css?v=mvc-perf-final"><style>.wrap{max-width:1320px;margin:auto;padding:120px 24px}.hero{background:#fff;border-radius:24px;padding:42px;margin-bottom:26px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}.card{background:#fff;border:1px solid #eee;border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,.05)}.card img{width:100%;height:240px;object-fit:cover}.body{padding:22px}.body h3{font-family:var(--font-serif);font-size:31px}.badge{display:inline-block;background:#0c985c;color:white;border-radius:999px;padding:7px 12px;font-weight:900}.price del{color:#999;margin-right:8px}.price strong{font-size:24px;color:#bd6c3c}.countdown{margin:10px 0;background:#eafff4;color:#047044;border:1px solid #b6e9cc;border-radius:999px;padding:8px 12px;font-weight:800;display:inline-flex;gap:7px}.badge{border-radius:0 0 7px 7px!important;padding:12px 13px!important;background:linear-gradient(180deg,#12a76b,#057044)!important}</style></head>
<body><header class="fh-header"><div class="fh-header__inner"><a href="/home" class="fh-logo"><span class="fh-logo__icon">◈</span><span class="fh-logo__text">FEELHOME</span></a><nav class="fh-nav"><a href="/home" class="fh-nav__link">Trang Chủ</a><a href="/home#rooms-section" class="fh-nav__link">Phòng Nghỉ</a><a href="/offers" class="fh-nav__link active">Ưu Đãi</a><a href="/favorites" class="fh-nav__link">Yêu Thích</a></nav></div></header>
<main class="wrap"><section class="hero"><p>Ưu đãi FeelHome</p><h1>Kỳ nghỉ tuyệt vời, mức giá tốt hơn</h1><form method="get" th:action="@{/offers}" style="display:flex;gap:10px;flex-wrap:wrap"><input type="date" name="checkin" th:value="${checkin}"><input type="date" name="checkout" th:value="${checkout}"><button class="fh-btn-primary" type="submit">Kiểm tra ưu đãi</button><a class="fh-btn-outline" href="/home#rooms-section">Xem toàn bộ phòng</a></form></section><div><strong th:text="${#lists.size(offers)}"></strong> ưu đãi đang áp dụng</div>
<div class="grid" th:if="${!#lists.isEmpty(offers)}"><article class="card" th:each="room:${offers}"><img th:src="${room.image}" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80'"><div class="body"><span class="badge" th:text="|-${room.discountPercent}%|"></span><h3 th:text="${room.name}"></h3><p th:text="${room.promotionName}"></p><div class="countdown js-promo-countdown" th:if="${room.promotionEndAt != null}" th:data-promo-end="${room.promotionEndAt}"><span>Đang tính...</span></div><div class="price"><del th:text="${#numbers.formatDecimal(room.originalPrice,0,'COMMA',0,'POINT')} + ' đ'"></del><strong th:text="${#numbers.formatDecimal(room.effectivePrice,0,'COMMA',0,'POINT')} + ' đ/đêm'"></strong></div><p th:text="|Còn ${room.availableRooms}/${room.totalRooms} phòng|"></p><a class="fh-btn-primary" th:href="${room.detailUrl}">Xem phòng</a></div></article></div><div class="empty" th:if="${#lists.isEmpty(offers)}">Hiện chưa có ưu đãi phù hợp.</div></main><script>(function(){function p(v){return String(v).padStart(2,'0')}function t(){document.querySelectorAll('.js-promo-countdown').forEach(e=>{let end=new Date(e.dataset.promoEnd),s=e.querySelector('span')||e,d=end-Date.now();if(isNaN(end))return;if(d<=0){s.textContent='Ưu đãi vừa hết hạn';return}let days=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000),sec=Math.floor(d%60000/1000);s.textContent='Còn '+(days?days+' ngày ':'')+p(h)+':'+p(m)+':'+p(sec)})}t();setInterval(t,1000)})();</script></body></html>
