<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt phòng - FeelHome Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f7f4; color: #1a1a1a; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        .modal {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); /* Hiệu ứng mờ hiện đại */
            z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<header class="py-6 px-10 flex justify-between items-center bg-white border-b border-stone-100">
    <div class="text-2xl font-bold tracking-tighter">◈ FEELHOME</div>
    <nav class="space-x-8 text-sm uppercase tracking-widest font-semibold">
        <a href="/" class="hover:text-[#d4af37]">Trang chủ</a>
        <a href="#" class="text-[#d4af37]">Đặt phòng</a>
    </nav>
</header>

<section class="max-w-5xl mx-auto -mt-10 relative z-10 bg-white p-8 rounded-2xl card-shadow border border-stone-100">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
        <div><label class="text-[10px] font-bold text-stone-400 uppercase">Nhận phòng</label>
            <input type="date" class="w-full border-b border-stone-200 py-2 focus:border-[#d4af37] outline-none"></div>
        <div><label class="text-[10px] font-bold text-stone-400 uppercase">Trả phòng</label>
            <input type="date" class="w-full border-b border-stone-200 py-2 focus:border-[#d4af37] outline-none"></div>
        <div><label class="text-[10px] font-bold text-stone-400 uppercase">Khách</label>
            <select class="w-full border-b border-stone-200 py-2 outline-none"><option>2 Người</option></select></div>
        <button class="bg-[#1a2b49] text-white py-3 rounded-xl hover:bg-black transition font-semibold">Tìm phòng</button>
    </div>
</section>

<main class="max-w-5xl mx-auto py-20 px-4">
    <h2 class="text-5xl text-center mb-16">Không gian nghỉ dưỡng</h2>
    <div id="room-list" class="space-y-8"></div>
</main>

<div id="booking-modal" class="modal">
    <div class="bg-white p-10 rounded-3xl w-full max-w-lg relative mx-4">
        <h2 class="text-3xl mb-6">Xác nhận: <span id="selected-room-name" class="text-[#d4af37]"></span></h2>
        <form id="booking-form" th:action="@{/booking/save}" method="post" class="space-y-4">
            <input type="hidden" name="roomTypeId" id="inputRoomTypeId">

            <div class="grid grid-cols-2 gap-4">
                <input type="date" name="checkinDate" class="p-4 bg-stone-50 rounded-xl outline-none" required>
                <input type="date" name="checkoutDate" class="p-4 bg-stone-50 rounded-xl outline-none" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] uppercase font-bold text-stone-400">Người lớn</label>
                    <input type="number" name="adultCount" value="1" min="1" class="w-full p-4 bg-stone-50 rounded-xl outline-none">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-bold text-stone-400">Trẻ em</label>
                    <input type="number" name="childCount" value="0" min="0" class="w-full p-4 bg-stone-50 rounded-xl outline-none">
                </div>
            </div>

            <input type="text" name="name" placeholder="Họ và tên" class="w-full p-4 bg-stone-50 rounded-xl outline-none" required>
            <input type="tel" name="phone" placeholder="Số điện thoại" class="w-full p-4 bg-stone-50 rounded-xl outline-none" required>
            <input type="email" name="email" placeholder="Email" class="w-full p-4 bg-stone-50 rounded-xl outline-none" required>

            <button type="submit" class="w-full mt-4 bg-[#1a2b49] text-white py-4 rounded-xl font-bold hover:bg-black transition">XÁC NHẬN ĐẶT</button>
        </form>
        <button onclick="closeModal()" class="absolute top-8 right-8 text-stone-400 hover:text-black">Đóng</button>
    </div>
</div>

<script>
    window.onload = async () => {
        const rooms = await (await fetch('/booking/api/all-room-types')).json();
        const list = document.getElementById('room-list');
        rooms.forEach(r => {
            list.innerHTML += `
                <div class="bg-white rounded-3xl p-6 flex flex-col md:flex-row gap-8 card-shadow border border-stone-100 items-center">
                    <img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?w=600" class="w-full md:w-80 h-60 object-cover rounded-2xl">
                    <div class="flex-1 space-y-4">
                        <h3 class="text-3xl">${r.nameType}</h3>
                        <p class="text-stone-500 text-sm leading-relaxed">${r.description}</p>
                        <div class="flex gap-6 text-sm text-stone-400 uppercase tracking-widest font-bold">
                            <span>🛏 ${r.bed || 'Giường đôi'}</span>
                            <span>📐 ${r.area || '25'}m²</span>
                        </div>
                        <div class="flex justify-between items-center pt-4">
                            <span class="text-2xl font-bold text-[#d4af37]">${r.price.toLocaleString()}đ</span>
                            <button onclick="selectRoom(${r.id}, '${r.nameType}')" class="bg-stone-900 text-white px-8 py-3 rounded-xl hover:bg-black transition">Đặt phòng</button>
                        </div>
                    </div>
                </div>
            `;
        });
    };

    function selectRoom(id, name) {
        document.getElementById('inputRoomTypeId').value = id;
        document.getElementById('selected-room-name').innerText = name;
        document.getElementById('booking-modal').classList.add('active');
    }
    function closeModal() { document.getElementById('booking-modal').classList.remove('active'); }
</script>
</body>
</html>
