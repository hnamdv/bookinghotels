<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
<div class="max-w-6xl mx-auto bg-white rounded-xl shadow p-6">
    <h2 class="text-2xl font-bold mb-6">Quản lý khách hàng</h2>

    <table class="w-full text-left border-collapse">
        <thead>
        <tr class="border-b text-gray-400 text-sm">
            <th class="pb-3">Họ và tên</th>
            <th class="pb-3">Email</th>
            <th class="pb-3">Thao tác</th>
        </tr>
        </thead>
        <tbody id="userTable">
        </tbody>
    </table>
</div>

<script>
    // 1. Hàm load danh sách
    async function loadUsers() {
        try {
            const res = await fetch('/api/admin/users', {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include' // BẮT BUỘC để gửi Cookie session
            });

            if (res.status === 403) {
                alert("Bạn không có quyền truy cập!");
                return;
            }

            const users = await res.json();
            const tbody = document.getElementById('userTable');

            tbody.innerHTML = users.map(u => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="py-4 font-medium">${u.name || 'N/A'}</td>
                    <td class="py-4 text-gray-600">${u.email || 'N/A'}</td>
                    <td class="py-4">
                        <button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700 font-medium">Xóa</button>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            console.error("Lỗi khi tải dữ liệu:", err);
        }
    }

    // 2. Hàm xóa khách hàng
    async function deleteUser(id) {
        if(confirm('Xác nhận xóa khách hàng này?')) {
            const res = await fetch(`/api/admin/users/${id}`, {
                method: 'DELETE', // Phải là DELETE
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include' // BẮT BUỘC
            });

            if (res.ok) {
                alert("Xóa thành công!");
                loadUsers(); // Tải lại bảng sau khi xóa
            } else {
                alert("Lỗi: Không thể xóa khách hàng!");
            }
        }
    }

    // Khởi chạy
    loadUsers();
</script>
</body>
</html>
