<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Đăng nhập - FeelHome Hotel</title>
  <style>
    /* Hiệu ứng kính mờ (Glassmorphism) */
    .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4"
      style="background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=80'); background-size: cover; background-position: center;">

<div class="absolute inset-0 bg-black/20"></div>

<div class="relative z-10 w-full max-w-sm glass-card p-8 rounded-3xl shadow-2xl">
  <div class="text-center mb-8">
    <div class="text-3xl font-bold text-[#1A2530] mb-2">Login to FeelHome</div>
    <p class="text-gray-500 text-sm">Welcome back to your sanctuary.</p>
  </div>

  <form id="loginForm" class="space-y-6">
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
      <input type="text" id="loginId" placeholder="name@example.com" required
             class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#1A2530] outline-none transition duration-300">
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
      <input type="password" id="password" placeholder="••••••••" required
             class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#1A2530] outline-none transition duration-300">
    </div>

    <button type="submit"
            class="w-full bg-[#1A2530] text-white py-3 rounded-xl font-bold hover:bg-black transition-all transform active:scale-95 shadow-lg">
      Login
    </button>
  </form>
</div>

<script>
  document.getElementById('loginForm').onsubmit = async (e) => {
       e.preventDefault();
       const loginId = document.getElementById('loginId').value;
       const password = document.getElementById('password').value;

       const response = await fetch('/api/auth/login', {
           method: 'POST',
           headers: {'Content-Type': 'application/json'},
           body: JSON.stringify({ loginId, password })
       });

       const data = await response.json();
       if (data.success) {
           // Chuyển hướng sau khi login thành công (giữ nguyên logic cũ)
           window.location.href = '/admin/users';
       } else {
           alert('Lỗi: ' + data.message);
       }
   };
</script>
</body>
</html>
