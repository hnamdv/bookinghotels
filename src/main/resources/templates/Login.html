<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Đăng nhập - FeelHome Hotel</title>
  <style>
    /* Hiệu ứng kính mờ (Glassmorphism) */
    .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4"
      style="background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=80'); background-size: cover; background-position: center;">
<body class="bg-gray-100 font-sans">
<div class="min-h-screen flex items-center justify-center p-4"
     style="background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=80'); background-size: cover; background-position: center;">

<div class="absolute inset-0 bg-black/20"></div>
  <div class="absolute inset-0 bg-white/30 backdrop-blur-sm"></div>

<div class="relative z-10 w-full max-w-sm glass-card p-8 rounded-3xl shadow-2xl">
  <div class="text-center mb-8">
    <div class="text-3xl font-bold text-[#1A2530] mb-2">Login to FeelHome</div>
    <p class="text-gray-500 text-sm">Welcome back to your sanctuary.</p>
  </div>
  <div class="relative z-10 w-full max-w-sm bg-white rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <div class="text-2xl font-bold text-[#1A2530]">📍 FeelHome</div>
      <p class="text-gray-500 text-sm mt-2">Welcome back to your sanctuary.</p>
    </div>

  <form id="loginForm" class="space-y-6">
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
      <input type="text" id="loginId" placeholder="name@example.com" required
             class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#1A2530] outline-none transition duration-300">
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
      <input type="password" id="password" placeholder="••••••••" required
             class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#1A2530] outline-none transition duration-300">
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required
               class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1A2530] outline-none transition">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="••••••••" required
               class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1A2530] outline-none transition">
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center text-gray-600">
          <input type="checkbox" class="mr-2"> Remember me
        </label>
        <a href="#" class="text-[#1A2530] font-medium hover:underline">Forgot password?</a>
      </div>

    <button type="submit"
            class="w-full bg-[#1A2530] text-white py-3 rounded-xl font-bold hover:bg-black transition-all transform active:scale-95 shadow-lg">
      Login
    </button>
  </form>
      <button type="submit" class="w-full bg-[#1A2530] text-white py-2.5 rounded-lg font-semibold hover:bg-gray-900 transition">Login</button>
    </form>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
      <div class="relative flex justify-center text-xs uppercase">
        <span class="bg-white px-2 text-gray-500">OR CONTINUE WITH</span>
      </div>
    </div>

    <button class="w-full border border-gray-300 py-2.5 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5 mr-2"> Login with Google
    </button>

    <p class="text-center text-sm text-gray-600 mt-6">
      Don't have an account? <a href="#" class="text-[#1A2530] font-semibold hover:underline">Create account</a>
    </p>

    <div class="flex justify-center space-x-6 mt-8 text-xs text-gray-400">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">Support</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('loginForm').onsubmit = async (e) => {
       e.preventDefault();
       const loginId = document.getElementById('loginId').value;
       const password = document.getElementById('password').value;

       const response = await fetch('/api/auth/login', {
           method: 'POST',
           headers: {'Content-Type': 'application/json'},
           body: JSON.stringify({ loginId, password })
       });

       const data = await response.json();
       if (data.success) {
           // Chuyển hướng sau khi login thành công (giữ nguyên logic cũ)
           window.location.href = '/admin/users';
       } else {
           alert('Lỗi: ' + data.message);
       }
   };
      e.preventDefault();
      const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
              email: document.getElementById('email').value,
              password: document.getElementById('password').value
          })
      });
      const data = await response.json();
      if (data.success) {
          alert('Đăng nhập thành công!');
      } else {
          alert('Lỗi: ' + data.message);
      }
  };
</script>
</body>
</html>
