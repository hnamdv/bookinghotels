<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{homeadmin}"> <body>
<div layout:fragment="content">
    <div class="container-fluid px-4 py-5">
        <h3 class="fw-bold mb-1">Xin chào, Nhân viên</h3>
        <p class="text-muted mb-5">Chọn chức năng để bắt đầu</p>

        <div class="row g-4">
            <div class="col-md-4">
                <a href="#" class="text-decoration-none">
                    <div class="card p-4 text-center border-0 shadow-sm h-100 hover-shadow">
                        <i class="fa-solid fa-user fa-2x mb-3 text-secondary"></i>
                        <h6 class="text-dark fw-bold mt-2">Quản lý User</h6>
                        <hr class="w-25 mx-auto">
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/admin/bookings}" class="text-decoration-none">
                    <div class="card p-4 text-center border-0 shadow-sm h-100 hover-shadow">
                        <i class="fa-solid fa-calendar-days fa-2x mb-3 text-secondary"></i>
                        <h6 class="text-dark fw-bold mt-2">Quản lý đơn đặt phòng</h6>
                        <hr class="w-25 mx-auto">
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="#" class="text-decoration-none">
                    <div class="card p-4 text-center border-0 shadow-sm h-100 hover-shadow">
                        <i class="fa-solid fa-right-left fa-2x mb-3 text-secondary"></i>
                        <h6 class="text-dark fw-bold mt-2">Check-in và check-out</h6>
                        <hr class="w-25 mx-auto">
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="#" class="text-decoration-none">
                    <div class="card p-4 text-center border-0 shadow-sm h-100 hover-shadow">
                        <i class="fa-solid fa-file-invoice fa-2x mb-3 text-secondary"></i>
                        <h6 class="text-dark fw-bold mt-2">Xuất hóa đơn</h6>
                        <hr class="w-25 mx-auto">
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="#" class="text-decoration-none">
                    <div class="card p-4 text-center border-0 shadow-sm h-100 hover-shadow">
                        <i class="fa-solid fa-wallet fa-2x mb-3 text-secondary"></i>
                        <h6 class="text-dark fw-bold mt-2">Quản lý hóa đơn và thanh toán</h6>
                        <hr class="w-25 mx-auto">
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
