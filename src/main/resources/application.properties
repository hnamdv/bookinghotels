spring.application.name=bookinghotels

# ===================================================================
# DATASOURCE CONFIGURATION (SUPABASE POSTGRESQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&preferQueryMode=simple
spring.datasource.username=postgres.kotdsvwryqwuoxjqzerx
spring.datasource.password=CONCACBAMAYDO
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Format SQL cho d? nhìn console
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# HIKARI CONNECTION POOL CONFIGURATION
# ===================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ===================================================================
# THYMELEAF CONFIGURATION
# ===================================================================
spring.thymeleaf.cache=false

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE