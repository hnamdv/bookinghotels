<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng yêu thích - FeelHome</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css?v=20260622-header-exact-v3">
<style>
.fav-confirm{position:fixed;inset:0;z-index:9999;display:none;place-items:center}.fav-confirm.show{display:grid}.fav-confirm__backdrop{position:absolute;inset:0;background:rgba(9,18,31,.62);backdrop-filter:blur(5px)}.fav-confirm__card{position:relative;z-index:1;width:min(92vw,420px);background:#fff;border-radius:24px;padding:34px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3)}.fav-confirm__close{position:absolute;right:16px;top:12px;border:0;background:transparent;font-size:30px;cursor:pointer}.fav-confirm__icon{width:82px;height:82px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:#fff1f1;color:#dc3545;border:3px solid #ffb9b9}.fav-confirm.show .fav-confirm__icon{animation:sadShake .65s ease-in-out}.fav-confirm__actions{display:flex;gap:12px;margin-top:24px}.fav-confirm__actions button{flex:1;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer}.fav-confirm__cancel{border:1px solid #d5dae1;background:#fff}.fav-confirm__danger{border:0;background:#dc3545;color:#fff}@keyframes sadShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
</style>
</head>
<body>
<header class="fh-header"><div class="fh-header__inner"><a href="/" class="fh-logo"><span class="fh-logo__icon">◈</span><span class="fh-logo__text">FEELHOME</span></a><nav class="fh-nav"><a href="/" class="fh-nav__link">Trang Chủ</a><a href="/favorites.html" class="fh-nav__link active">Yêu Thích</a></nav></div></header>
<main class="room-section" style="padding-top:120px;min-height:70vh"><div class="section-heading"><p>Danh sách đã lưu</p><h2>Phòng yêu thích</h2></div><div class="room-grid" id="favoriteGrid" style="max-width:1320px;margin:auto"></div></main>
<script src="/js/favorites.js"></script>
<script src="/js/public-header.js"></script>

<div class="fav-confirm" id="favConfirm" aria-hidden="true">
  <div class="fav-confirm__backdrop" data-fav-close></div>
  <div class="fav-confirm__card" role="dialog" aria-modal="true" aria-labelledby="favConfirmTitle">
    <button class="fav-confirm__close" type="button" data-fav-close aria-label="Đóng">×</button>
    <div class="fav-confirm__icon" id="favConfirmIcon">☹</div>
    <h3 id="favConfirmTitle">Bạn muốn hủy lưu phòng này?</h3>
    <p id="favConfirmText">Phòng sẽ bị xóa khỏi danh sách yêu thích của bạn.</p>
    <div class="fav-confirm__actions" id="favConfirmActions"><button type="button" class="fav-confirm__cancel" data-fav-close>Giữ lại</button><button type="button" class="fav-confirm__danger" id="confirmRemoveFavorite">Xác nhận hủy</button></div>
  </div>
</div>

</body>
</html>
