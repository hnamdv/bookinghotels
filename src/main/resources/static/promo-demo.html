<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Demo áp dụng mã giảm giá</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            padding: 40px;
        }

        .box {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #132230;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear {
            background: #777;
            margin-left: 8px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 14px 0;
            font-size: 17px;
        }

        .final {
            border-top: 1px solid #ddd;
            padding-top: 16px;
            font-size: 22px;
            font-weight: bold;
        }

        #promotionMessage {
            margin-top: 12px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Demo áp dụng mã giảm giá</h2>

    <div class="row">
        <span>Tiền phòng gốc:</span>
        <span id="originalPrice" data-price="1000000">1.000.000 VNĐ</span>
    </div>

    <label>Mã giảm giá</label>
    <input type="text" id="promotionCode" placeholder="Nhập mã giảm giá, ví dụ: spring hehe">

    <button type="button" onclick="applyPromotion()">Áp dụng</button>
    <button type="button" class="btn-clear" onclick="clearPromotion()">Hủy mã</button>

    <p id="promotionMessage"></p>

    <div class="row">
        <span>% giảm:</span>
        <span id="discountPercent">0%</span>
    </div>

    <div class="row">
        <span>Số tiền giảm:</span>
        <span id="discountAmount">0 VNĐ</span>
    </div>

    <div class="row final">
        <span>Thành tiền:</span>
        <span id="finalPrice">1.000.000 VNĐ</span>
    </div>

    <!-- Mấy input này dùng để gửi về backend khi đặt phòng thật -->
    <input type="hidden" id="promotionIdInput" name="promotionId">
    <input type="hidden" id="finalPriceInput" name="finalPrice" value="1000000">
</div>

<script>
    const originalPrice = 1000000;

    function formatVND(value) {
        return value.toLocaleString("vi-VN") + " VNĐ";
    }

    async function applyPromotion() {
        const code = document.getElementById("promotionCode").value.trim();
        const message = document.getElementById("promotionMessage");

        if (!code) {
            message.className = "error";
            message.innerText = "Vui lòng nhập mã giảm giá";
            return;
        }

        try {
            const response = await fetch(`/api/promotions/check?code=${encodeURIComponent(code)}`);
            const result = await response.json();

            if (!result.valid) {
                message.className = "error";
                message.innerText = result.message;

                document.getElementById("discountPercent").innerText = "0%";
                document.getElementById("discountAmount").innerText = "0 VNĐ";
                document.getElementById("finalPrice").innerText = formatVND(originalPrice);
                document.getElementById("promotionIdInput").value = "";
                document.getElementById("finalPriceInput").value = originalPrice;
                return;
            }

            const discountPercent = result.discountPercent;
            const discountAmount = originalPrice * discountPercent / 100;
            const finalPrice = originalPrice - discountAmount;

            document.getElementById("discountPercent").innerText = discountPercent + "%";
            document.getElementById("discountAmount").innerText = formatVND(discountAmount);
            document.getElementById("finalPrice").innerText = formatVND(finalPrice);

            document.getElementById("promotionIdInput").value = result.promotionId;
            document.getElementById("finalPriceInput").value = finalPrice;

            message.className = "success";
            message.innerText = `Áp dụng mã thành công: ${result.promotionName}`;
        } catch (error) {
            message.className = "error";
            message.innerText = "Không thể kiểm tra mã giảm giá";
        }
    }

    function clearPromotion() {
        document.getElementById("promotionCode").value = "";
        document.getElementById("promotionMessage").innerText = "";
        document.getElementById("promotionMessage").className = "";

        document.getElementById("discountPercent").innerText = "0%";
        document.getElementById("discountAmount").innerText = "0 VNĐ";
        document.getElementById("finalPrice").innerText = formatVND(originalPrice);

        document.getElementById("promotionIdInput").value = "";
        document.getElementById("finalPriceInput").value = originalPrice;
    }
</script>

</body>
</html>
